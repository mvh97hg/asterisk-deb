name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: jammy
            image: ubuntu:22.04
          - distro: noble
            image: ubuntu:24.04
          - distro: bookworm
            image: debian:12
          - distro: trixie
            image: debian:13

    runs-on: ubuntu-latest

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install base packages
        run: |
          apt-get update
          apt-get install -y \
            git \
            curl \
            ca-certificates \
            devscripts \
            debhelper

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Changelog and Build
        run: |
          # 1. Định nghĩa thông tin người build (bắt buộc đối với lệnh dch)
          export DEBEMAIL="github-actions@github.com"
          export DEBFULLNAME="GitHub Actions"
          
          # 2. Trích xuất version từ git tag (bỏ chữ 'v')
          VERSION="${GITHUB_REF_NAME#v}"
          
          # 3. Tự động cập nhật debian/changelog theo từng distro trong matrix
          # Kết quả version sẽ có dạng: 1.0.0~jammy, 1.0.0~noble...
          dch --create \
              --package "asterisk" \
              --newversion "1:${VERSION}~${{ matrix.distro }}" \
              --distribution "${{ matrix.distro }}" \
              "Automated build for ${{ matrix.distro }} via GitHub Actions"
          
          # 4. Chạy script build của bạn
          chmod +x build-deb.sh
          ./build-deb.sh --version "1:${VERSION}~${{ matrix.distro }}"

      - name: Collect artifacts
        run: |
          mkdir -p release
          # Gom tất cả các file liên quan đến gói deb đã build trong /opt/build
          find /opt/build -maxdepth 1 -type f \
            \( -name "*.deb" -o -name "*.changes" -o -name "*.buildinfo" \) \
            -exec cp {} release/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.distro }}
          path: release/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files
        run: |
          find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.changes
            artifacts/**/*.buildinfo
          generate_release_notes: true